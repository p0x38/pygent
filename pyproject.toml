[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "pygent"
version = "0.1.0"
description = "A modular, provider-agnostic AI agent framework for Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [
    { name = "p0x38" },
]
keywords = [
    "ai",
    "agent",
    "llm",
    "ollama",
    "openai",
    "tools",
    "agents",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.11.7",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/p0x38/pygent"
Repository = "https://github.com/p0x38/pygent"
Issues = "https://github.com/p0x38/pygent/issues"

[project.scripts]
pygent = "pygent.cli:main"

[project.optional-dependencies]
ollama = ["ollama>=0.6.2"]
dotenv = ["python-dotenv>=1.0.1"]
cli = ["click>=8.3.1", "rich>=14.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
