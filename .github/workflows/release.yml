name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"

          if [ "$tag" != "$version" ]; then
            echo "Tag version ($tag) does not match package version ($version)"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Verify package
        run: uv run --with twine twine check dist/*

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TWINE_REPOSITORY_URL: https://upload.pypi.pkg.github.com/${{ github.repository_owner }}/
        run: uv run --with twine twine upload --repository-url "$TWINE_REPOSITORY_URL" dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/*
