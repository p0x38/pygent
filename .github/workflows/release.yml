name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"

          if [ "$tag" != "$version" ]; then
            echo "Tag version ($tag) does not match package version ($version)"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Verify package
        run: uv run --with twine twine check dist/*

      - name: Publish to GitLab PyPI
        env:
          TWINE_USERNAME: ${{ secrets.GITLAB_PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.GITLAB_PYPI_TOKEN }}
        run: |
          uv run --with twine twine upload \
            --repository-url \
            https://gitlab.com/api/v4/projects/86082729/packages/pypi \
            dist/*

      - name: Generate release notes
        run: |
          uvx git-cliff --latest --strip header > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist/*